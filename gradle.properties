# ===== 版本号集中管理：改版本只动这里 =====
modVersion=1.0.3
minecraftVersion=1.20.1

# 玩家侧最低 Forge 版本（写进 mods.toml 的依赖范围 [47.3.5,)，
# 你的整合包用 47.3.5 或任何更高的 47.x 都能装本模组）
forgeVersion=47.3.5

# 编译环境的 Forge 版本（平台构建容器固定提供，请勿改）
forgeBuildVersion=47.4.0

# ===== 固定标识（一般不用改）=====
modId=thundercloud
modName=\u96f7\u4e91\u6838\u5fc3 ThunderCloud Core
modGroup=cn.blockforge.generated.thundercloud

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=false
